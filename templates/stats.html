
{% extends "base.html" %}
{% block title %}Stats{% endblock %}

{% block content %}
  <div class="summary-card">
    <h1>Current Run Stats</h1>

    <div class="run-card">
      <div><strong>Run ID:</strong> {{ run.id }}</div>
      <div><strong>Van:</strong> {{ run.van_number }}</div>
      <div><strong>Start:</strong> {{ run.start_time or 'N/A' }}</div>
    </div>
  </div>
{% endblock %}
